<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#311b92" />
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />
  <rect width="496" height="496" x="8" y="8" rx="102" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="4" />

  <!-- Outer Glowing Circle -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#iconGrad)" stroke-width="8" opacity="0.3" filter="url(#glow)" />

  <!-- Brain & Sparkle Icon Art -->
  <g transform="translate(106, 106) scale(0.6)">
    <!-- Brain / AI Circuit Nodes -->
    <path fill="url(#iconGrad)" filter="url(#glow)" d="M256,32 C132.3,32 32,132.3 32,256 C32,379.7 132.3,480 256,480 C379.7,480 480,379.7 480,256 C480,132.3 379.7,32 256,32 Z M256,420 C165.4,420 92,346.6 92,256 C92,165.4 165.4,92 256,92 C346.6,92 420,165.4 420,256 C420,346.6 346.6,420 256,420 Z"/>
    
    <!-- Central Brain Node Structure -->
    <path fill="#ffffff" d="M256,120 C181.4,120 121,180.4 121,255 C121,304.5 147.8,347.8 187.5,371 C193.3,374.4 200.7,370.2 200.7,363.5 L200.7,341.2 C200.7,336.8 198.3,332.7 194.5,330.6 C168.2,315.8 151,287.4 151,255 C151,197 198,150 256,150 C314,150 361,197 361,255 C361,287.4 343.8,315.8 317.5,330.6 C313.7,332.7 311.3,336.8 311.3,341.2 L311.3,363.5 C311.3,370.2 318.7,374.4 324.5,371 C364.2,347.8 391,304.5 391,255 C391,180.4 330.6,120 256,120 Z"/>

    <!-- Graduation Cap / AI Sparkles Center -->
    <path fill="#f59e0b" d="M256,190 L320,225 L256,260 L192,225 Z"/>
    <path fill="#10b981" d="M220,245 L220,275 C220,285 236,295 256,295 C276,295 292,285 292,275 L292,245 L256,265 Z"/>
